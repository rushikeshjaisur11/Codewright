# Capability cards: third-party libraries and platforms.
# kind: library cards are preferred when the library is already installed
# ("installed"); otherwise they are offered as a well-known option with +1 effort.

- id: tenacity.retry
  intent: retry
  topic: Retries
  title: Replace the hand-written retry loop with tenacity
  symbol: tenacity.retry
  kind: library
  library: tenacity
  versions: ">=8.0"
  offer_uninstalled: true
  suggestion: >-
    Decorate the call with @tenacity.retry and declare the policy (attempts,
    exponential backoff with jitter, which exceptions retry) instead of a
    loop with try/except and sleep.
  gain: >-
    A declarative, tested retry policy: exponential backoff with jitter avoids
    synchronised retry storms, only the listed exceptions retry, and the loop,
    counter and sleep code go away. Works for async functions too.
  effort: 2
  impact: 3
  risk: >-
    Retrying a non-idempotent call (a payment, an insert without an idempotency
    key) can apply it twice. Make sure the retried exceptions are transient.
  when_not: >-
    When the client library already retries (google-api-core Retry, botocore,
    urllib3 Retry on a requests adapter): configure that one instead of stacking
    two retry layers.
  threshold: >-
    Under sustained downstream failure at high request rates, retries multiply
    load; add a circuit breaker or a retry budget.
  sources:
    - https://tenacity.readthedocs.io/en/latest/
  snippet: |
    from tenacity import retry, retry_if_exception_type, stop_after_attempt, wait_random_exponential

    @retry(
        stop=stop_after_attempt(5),
        wait=wait_random_exponential(multiplier=0.5, max=10),
        retry=retry_if_exception_type((ConnectionError, TimeoutError)),
        reraise=True,
    )
    def call_service(url: str) -> bytes:
        ...

- id: postgres.skip-locked-queue
  intent: poll-queue
  title: Use SELECT ... FOR UPDATE SKIP LOCKED with LISTEN/NOTIFY instead of polling
  symbol: "PostgreSQL FOR UPDATE SKIP LOCKED + LISTEN/NOTIFY"
  kind: platform
  library: null
  requires_any: [psycopg, psycopg2, psycopg2-binary, asyncpg, sqlalchemy]
  versions: "*"
  suggestion: >-
    Claim jobs with `SELECT ... FOR UPDATE SKIP LOCKED LIMIT n` inside a
    transaction, and wake workers with LISTEN/NOTIFY instead of a sleep loop.
  gain: >-
    No double-processing when several workers run, and workers wake as soon as
    a job is inserted instead of querying on a fixed interval.
  effort: 3
  impact: 3
  risk: >-
    NOTIFY is not delivered to a worker that is disconnected, so keep a slow
    fallback poll. Long transactions while holding a claimed row block vacuum.
  when_not: >-
    When the database is not PostgreSQL, or the queue already lives in a broker
    (Cloud Tasks, Pub/Sub, SQS, Celery).
  threshold: >-
    When job volume or fan-out outgrows one database (many consumers per message,
    replay, cross-service delivery), move to a dedicated broker.
  match:
    skip_locked: false
  sources:
    - https://www.postgresql.org/docs/current/sql-select.html#SQL-FOR-UPDATE-SHARE
    - https://www.postgresql.org/docs/current/sql-listen.html
    - https://www.postgresql.org/docs/current/sql-notify.html
  snippet_lang: sql
  snippet: |
    SELECT id, payload FROM jobs
    WHERE status = 'pending'
    ORDER BY id
    FOR UPDATE SKIP LOCKED
    LIMIT 10;

- id: sqlalchemy.engine-once
  intent: connection-per-request
  topic: SQLAlchemy
  title: Create the SQLAlchemy engine once and reuse its connection pool
  symbol: sqlalchemy.create_engine
  kind: library
  library: sqlalchemy
  versions: ">=1.4"
  match:
    library: sqlalchemy
  suggestion: >-
    Create the engine once at module import or in the app lifespan, and check
    out connections per request with `with engine.connect()`; the engine pools them.
  gain: >-
    The engine's built-in connection pool is reused, so requests skip the TCP,
    TLS and auth handshake, and the database sees a bounded number of connections.
  effort: 2
  impact: 4
  risk: >-
    Pool size times worker count must stay under the database's max_connections.
  when_not: >-
    In short-lived serverless functions that serve one request each; there, use
    NullPool or a server-side pooler such as PgBouncer.
  threshold: >-
    Past a few hundred concurrent workers, add a server-side pooler (PgBouncer,
    Cloud SQL connector) in front of the database.
  sources:
    - https://docs.sqlalchemy.org/en/20/core/pooling.html
    - https://fastapi.tiangolo.com/advanced/events/

- id: psycopg.pool
  intent: connection-per-request
  title: Use a psycopg connection pool opened at app startup
  symbol: psycopg_pool.ConnectionPool
  kind: library
  library: psycopg-pool
  versions: ">=3.1"
  requires_any: [psycopg]
  offer_uninstalled: true
  match:
    library: psycopg
  suggestion: >-
    Open one psycopg_pool.ConnectionPool (or AsyncConnectionPool) in the app
    lifespan and borrow connections with `with pool.connection() as conn:`.
  gain: >-
    Requests reuse open connections instead of paying the connect handshake each
    time, and concurrent connections are capped.
  effort: 2
  impact: 4
  risk: >-
    A connection returned in a failed transaction state is reset by the pool;
    code that relied on per-request isolation of session settings must reset them.
  when_not: >-
    In one-shot scripts or serverless handlers that run a single query.
  threshold: >-
    Past a few hundred concurrent workers, add a server-side pooler such as PgBouncer.
  sources:
    - https://www.psycopg.org/psycopg3/docs/advanced/pool.html
    - https://fastapi.tiangolo.com/advanced/events/

- id: asyncpg.pool
  intent: connection-per-request
  title: Create one asyncpg pool at app startup
  symbol: asyncpg.create_pool
  kind: library
  library: asyncpg
  versions: ">=0.20"
  match:
    library: asyncpg
  suggestion: >-
    Call asyncpg.create_pool() once in the app lifespan and use
    `async with pool.acquire() as conn:` in handlers.
  gain: >-
    Connections are reused across requests and capped, removing the per-request
    connect latency.
  effort: 2
  impact: 4
  risk: >-
    Prepared-statement caching conflicts with PgBouncer in transaction mode;
    set statement_cache_size=0 there.
  when_not: >-
    In one-shot scripts or serverless handlers that run a single query.
  threshold: >-
    Past a few hundred concurrent workers, add a server-side pooler such as PgBouncer.
  sources:
    - https://magicstack.github.io/asyncpg/current/api/index.html#connection-pools
    - https://fastapi.tiangolo.com/advanced/events/

- id: httpx.shared-client
  intent: connection-per-request
  topic: HTTP clients
  title: Share one httpx client across requests
  symbol: httpx.AsyncClient
  kind: library
  library: httpx
  versions: ">=0.18"
  match:
    library: httpx
  suggestion: >-
    Create one httpx.Client/AsyncClient in the app lifespan and reuse it, instead
    of building a client inside each request handler.
  gain: >-
    Keep-alive connection pooling: repeat calls to the same host skip DNS, TCP
    and TLS setup.
  effort: 1
  impact: 3
  risk: >-
    Per-request headers or auth must move to the request call, not the shared client.
  when_not: >-
    When each request needs a differently configured client (proxies, certs).
  threshold: >-
    At high fan-out to one host, tune httpx.Limits(max_connections, max_keepalive_connections).
  sources:
    - https://www.python-httpx.org/advanced/clients/
    - https://fastapi.tiangolo.com/advanced/events/

- id: requests.shared-session
  intent: connection-per-request
  topic: HTTP clients
  title: Reuse one requests.Session instead of creating one per request
  symbol: requests.Session
  kind: library
  library: requests
  versions: ">=2.0"
  match:
    library: requests
  suggestion: >-
    Create the Session once (module level or app startup) and reuse it.
  gain: >-
    Keep-alive connection pooling through urllib3: repeat calls skip TCP and TLS setup.
  effort: 1
  impact: 3
  risk: >-
    Cookies and default headers set on the session are shared by all callers.
  when_not: >-
    When callers need isolated cookies or credentials.
  threshold: >-
    Under heavy concurrency, tune the HTTPAdapter pool_maxsize.
  sources:
    - https://requests.readthedocs.io/en/latest/user/advanced/#session-objects
