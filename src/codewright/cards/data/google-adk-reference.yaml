# --------------------------------------------------------------------------- runtime, context and apps

- id: adk.ref.app
  intent: reference
  topic: Runtime, context and apps
  title: Configure the whole agent app in one App object
  symbol: google.adk.apps.App
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    `App(name=..., root_agent=..., plugins=[...], events_compaction_config=...,
    context_cache_config=..., resumability_config=...)`, passed to the Runner
    as `app=`.
  gain: >-
    One place for app-wide settings; plugins, compaction, caching and
    resumability are only configurable here.
  effort: 1
  impact: 2
  risk: >-
    None; the Runner still accepts agent= for simple cases.
  when_not: >-
    For a single agent in a script.
  threshold: >-
    As soon as you need any app-wide setting.
  sources:
    - https://adk.dev/apps/

- id: adk.ref.context-cache
  intent: reference
  topic: Runtime, context and apps
  title: Cache the stable part of the prompt with ContextCacheConfig
  symbol: google.adk.agents.context_cache_config.ContextCacheConfig
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Set `context_cache_config=ContextCacheConfig(min_tokens=..., ttl_seconds=...,
    cache_intervals=...)` on the App, and put fixed text in the agent's
    `static_instruction` so it comes first and can be cached.
  gain: >-
    Large, unchanging instructions and documents are cached by Gemini and
    billed at the cached-token rate, which also cuts latency.
  effort: 1
  impact: 3
  risk: >-
    Only pays off above the minimum cacheable size and with repeated calls
    within the TTL.
  when_not: >-
    For short prompts or rarely used agents.
  threshold: >-
    When the same long instruction or document goes into most requests.
  sources:
    - https://adk.dev/context/caching/

- id: adk.ref.resumability
  intent: reference
  topic: Runtime, context and apps
  title: Resume interrupted or paused runs with ResumabilityConfig
  symbol: google.adk.apps.ResumabilityConfig
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Set `resumability_config=ResumabilityConfig(is_resumable=True)` on the
    App; call run_async with the paused or failed `invocation_id` to continue
    from the last event.
  gain: >-
    Long-running tools can pause a run and a crashed run can continue,
    instead of starting the turn over.
  effort: 1
  impact: 3
  risk: >-
    Best effort and at-least-once: resumed tool calls must be idempotent, and
    temp: state is lost.
  when_not: >-
    For short turns where re-running is cheap.
  threshold: >-
    Once turns run long tools or approvals.
  sources:
    - https://adk.dev/runtime/resume/

- id: adk.ref.run-config
  intent: reference
  topic: Runtime, context and apps
  title: Cap model calls and stream tokens with RunConfig
  symbol: google.adk.agents.RunConfig
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Pass `run_config=RunConfig(max_llm_calls=..., streaming_mode=StreamingMode.SSE)`
    to run_async. max_llm_calls (default 500, or ADK_MAX_LLM_CALLS) stops a
    run that loops; SSE streams partial text as it is generated.
  gain: >-
    A hard limit on runaway cost per turn, and responsive streaming UIs.
  effort: 1
  impact: 3
  risk: >-
    Too low a limit cuts off legitimate multi-tool turns.
  when_not: >-
    Never leave a production agent without a deliberate limit.
  threshold: >-
    Any production deployment.
  sources:
    - https://adk.dev/runtime/runconfig/

- id: adk.ref.cancel
  intent: reference
  topic: Runtime, context and apps
  title: Cancel a running turn with abort_signal
  symbol: google.adk.runners.Runner.run_async
  kind: library
  library: google-adk
  versions: ">=2.11.0"
  suggestion: >-
    Pass an `asyncio.Event` as `abort_signal=` to run_async and set it when
    the user presses stop or a timeout fires.
  gain: >-
    The model call and tools stop instead of running to completion after the
    user has gone, saving tokens and tool side effects.
  effort: 1
  impact: 2
  risk: >-
    Custom tools should check the signal to stop long work early.
  when_not: >-
    For turns that must finish once started.
  threshold: >-
    Any chat UI with a stop button.
  sources:
    - https://github.com/google/adk-python/blob/main/src/google/adk/runners.py
    - https://adk.dev/runtime/cancel/

- id: adk.ref.live
  intent: reference
  topic: Runtime, context and apps
  title: Build voice and video agents with run_live and LiveRequestQueue
  symbol: google.adk.agents.LiveRequestQueue
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Use `runner.run_live(...)` with a LiveRequestQueue to stream audio, video
    or text both ways with a Gemini Live model.
  gain: >-
    Real-time, interruptible conversations with the same agents, tools and
    sessions as text.
  effort: 4
  impact: 3
  risk: >-
    Needs a Live-capable model and a client that streams media.
  when_not: >-
    For request/response chat.
  threshold: >-
    When users talk to the agent rather than type.
  sources:
    - https://adk.dev/live/

