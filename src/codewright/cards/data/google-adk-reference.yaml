# --------------------------------------------------------------------------- evaluation and observability

- id: adk.ref.evaluation
  intent: reference
  topic: Evaluation and observability
  title: Test agent behaviour with eval sets and AgentEvaluator
  symbol: google.adk.evaluation.AgentEvaluator
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Save conversations as `.test.json` files or eval sets (the dev UI can
    record them) and run them with `adk eval` or
    `AgentEvaluator.evaluate(...)` in pytest, scoring tool trajectories and
    final responses.
  gain: >-
    Catches regressions in tool choice and answers when prompts, models or
    ADK versions change, which unit tests on code can't.
  effort: 3
  impact: 4
  risk: >-
    Needs `google-adk[eval]` on 2.x; model-graded metrics cost model calls and
    vary between runs (num_runs averages them).
  when_not: >-
    For deterministic code paths: plain unit tests are cheaper.
  threshold: >-
    Before changing the model, the instructions or the ADK version.
  sources:
    - https://adk.dev/evaluate/
    - https://adk.dev/evaluate/criteria/

- id: adk.ref.tracing
  intent: reference
  topic: Evaluation and observability
  title: Trace runs with OpenTelemetry
  symbol: google.adk.cli.fast_api.get_fast_api_app
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    ADK emits OpenTelemetry spans for agents, model calls and tools using the
    GenAI semantic conventions. Export them over OTLP, or to Google Cloud with
    `--otel_to_cloud` (adk CLI) or `otel_to_cloud=True` in get_fast_api_app.
  gain: >-
    Latency, token use and failures per step in your existing tracing
    backend, without instrumenting the agent yourself.
  effort: 1
  impact: 3
  risk: >-
    Spans can include prompt content; check what you export.
  when_not: >-
    Never skip it in production.
  threshold: >-
    From the first production deployment.
  sources:
    - https://adk.dev/observability/traces/

