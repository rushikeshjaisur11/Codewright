# Google ADK (google-adk) knowledge base: features no detector maps to.
# intent: reference entries are never findings. They are searchable in the Knowledge base,
# served to coding agents over MCP (search_knowledge), and listed as what an upgrade unlocks.
# Knowledge covers google-adk 2.x only (1.x has had no release since 1.39.1, August 2026).
# A `versions` lower bound above 2.0 is the first 2.x release with the API, found by checking
# the source of every 2.x minor release on PyPI (2.0.0 to 2.14.1). each symbol was
# imported from google-adk 2.14.1.

# --------------------------------------------------------------------------- agents and orchestration

- id: adk.ref.sub-agents
  intent: reference
  topic: Agents and orchestration
  title: Let the model delegate to specialist agents with sub_agents
  symbol: google.adk.tools.transfer_to_agent
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Give a coordinating LlmAgent `sub_agents=[...]`, each with a short, precise
    `description`. The model hands the conversation to the best match by
    calling transfer_to_agent; the specialist then answers the user directly.
  gain: >-
    Routing is decided by the model from the agents' descriptions, so adding a
    specialist means adding an agent, not another branch of if/elif routing
    code.
  effort: 2
  impact: 3
  risk: >-
    Misroutes come from vague or overlapping descriptions; control moves to
    the specialist, so the coordinator doesn't see its answer (use AgentTool
    if it should).
  when_not: >-
    When the steps always run in the same order: use a Workflow.
  threshold: >-
    Worth it from two or three distinct kinds of request.
  sources:
    - https://adk.dev/workflows/patterns/
    - https://adk.dev/agents/llm-agents/
  snippet: |
    from google.adk.agents import LlmAgent

    billing = LlmAgent(name="billing", model="gemini-flash-latest", description="Invoices, refunds and payment methods.")
    support = LlmAgent(name="support", model="gemini-flash-latest", description="Bugs, errors and how-to questions.")

    root_agent = LlmAgent(
        name="coordinator",
        model="gemini-flash-latest",
        instruction="Route each request to the right specialist.",
        sub_agents=[billing, support],
    )

- id: adk.ref.custom-agent
  intent: reference
  topic: Agents and orchestration
  title: Write custom control flow as a BaseAgent subclass
  symbol: google.adk.agents.BaseAgent
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Subclass BaseAgent and implement `async def _run_async_impl(self, ctx)`,
    calling sub-agents' `run_async(ctx)` and yielding their events, for logic
    no built-in agent expresses.
  gain: >-
    Arbitrary Python control flow (conditions on state, external checks)
    while events, state and tracing still flow through ADK.
  effort: 3
  impact: 3
  risk: >-
    You own the orchestration bugs; on 2.x a Workflow covers most branching
    and looping without a subclass.
  when_not: >-
    When a Workflow, sub_agents or AgentTool already expresses the flow.
  threshold: >-
    When the flow depends on state or external results in ways a graph of
    routes can't express.
  sources:
    - https://adk.dev/agents/custom-agents/

- id: adk.ref.workflow-routes
  intent: reference
  topic: Agents and orchestration
  title: Branch, loop and run steps in parallel with Workflow graphs
  symbol: google.adk.Workflow
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Build a Workflow from edges between agents and plain functions; route on a
    node's output to choose the next node, and fan out to run nodes in
    parallel.
  gain: >-
    Deterministic orchestration as data: branches, loops and parallel steps
    are visible in the dev UI and traces, and the graph replaces
    SequentialAgent, ParallelAgent and LoopAgent, deprecated in 2.0.
  effort: 3
  impact: 4
  risk: >-
    A Workflow can't be an LlmAgent sub-agent yet.
  when_not: >-
    When the model should decide what happens next: use sub_agents.
  threshold: >-
    From the first fixed branch or loop in a multi-step agent.
  sources:
    - https://adk.dev/graphs/
    - https://adk.dev/graphs/routes/
    - https://adk.dev/graphs/dynamic/

- id: adk.ref.workflow-human-input
  intent: reference
  topic: Agents and orchestration
  title: Pause a Workflow for human input with RequestInput
  symbol: google.adk.events.RequestInput
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    In a Workflow node, `yield RequestInput(message=...)` to stop and wait for
    the user's answer; the next node receives it.
  gain: >-
    Approval and clarification steps without a hand-built pending-state
    machine: the run pauses at that node and resumes there.
  effort: 2
  impact: 3
  risk: >-
    The client has to show the request and send the answer back to the same
    session.
  when_not: >-
    When the model itself should ask a follow-up question in conversation.
  threshold: >-
    Any step that needs a person's sign-off (payments, emails, deletions).
  sources:
    - https://adk.dev/graphs/human-input/
  snippet: |
    from google.adk import Workflow
    from google.adk.events import RequestInput

    def ask_amount():
        yield RequestInput(message="How much should be refunded?")

    def refund(node_input: str):
        return f"Refunding {node_input}"

    root_agent = Workflow(name="refund_flow", edges=[("START", ask_amount, refund)])

- id: adk.ref.workflow-retry
  intent: reference
  topic: Agents and orchestration
  title: Retry a flaky Workflow node with RetryConfig
  symbol: google.adk.workflow.RetryConfig
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Set `retry_config=RetryConfig(max_attempts=..., exceptions=[...])` on the
    node (agents accept it too) instead of a try/except loop inside it.
  gain: >-
    Exponential backoff with jitter per node, limited to the exceptions you
    list, and only the failing node re-runs, not the whole workflow.
  effort: 1
  impact: 3
  risk: >-
    Retried nodes must be idempotent.
  when_not: >-
    For model API errors (429, 5xx): Gemini(retry_options=...) retries just
    the request.
  threshold: >-
    Any node that calls an unreliable service.
  sources:
    - https://adk.dev/graphs/retry/
    - https://github.com/google/adk-python/blob/main/src/google/adk/workflow/_retry_config.py

- id: adk.ref.planner
  intent: reference
  topic: Agents and orchestration
  title: Turn on the model's thinking with BuiltInPlanner
  symbol: google.adk.planners.BuiltInPlanner
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Set `planner=BuiltInPlanner(thinking_config=types.ThinkingConfig(...))` on
    the agent to use Gemini's built-in thinking, or PlanReActPlanner for
    models without it.
  gain: >-
    Better multi-step tool use on hard tasks, with the thinking budget set in
    one place.
  effort: 1
  impact: 2
  risk: >-
    Thinking adds latency and output tokens.
  when_not: >-
    For simple, latency-sensitive replies.
  threshold: >-
    When the agent chains several tools or gets multi-step tasks wrong.
  sources:
    - https://adk.dev/agents/llm-agents/
  snippet: |
    from google.adk.agents import LlmAgent
    from google.adk.planners import BuiltInPlanner
    from google.genai import types

    root_agent = LlmAgent(
        name="analyst",
        model="gemini-flash-latest",
        planner=BuiltInPlanner(thinking_config=types.ThinkingConfig(thinking_budget=1024)),
    )

- id: adk.ref.a2a-expose
  intent: reference
  topic: Agents and orchestration
  title: Serve an agent to other agents over A2A with to_a2a
  symbol: google.adk.a2a.utils.agent_to_a2a.to_a2a
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    `app = to_a2a(root_agent, port=8001)` returns an ASGI app speaking the
    Agent2Agent protocol, with an agent card; run it with uvicorn.
  gain: >-
    Other teams' agents, in any framework that speaks A2A, can call yours as
    a remote agent without a custom API.
  effort: 2
  impact: 3
  risk: >-
    Needs `google-adk[a2a]`; put authentication in front of it.
  when_not: >-
    When the caller is in the same process: use AgentTool or sub_agents.
  threshold: >-
    When agents are owned or deployed by different teams.
  sources:
    - https://adk.dev/a2a/quickstart-exposing/
    - https://adk.dev/a2a/

- id: adk.ref.a2a-consume
  intent: reference
  topic: Agents and orchestration
  title: Call a remote agent with RemoteA2aAgent
  symbol: google.adk.agents.remote_a2a_agent.RemoteA2aAgent
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Create `RemoteA2aAgent(name=..., agent_card=<url of its agent card>)` and
    use it as a sub-agent or wrap it in AgentTool.
  gain: >-
    A remote agent behaves like a local one in the agent tree: delegation,
    events and tracing work the same.
  effort: 2
  impact: 3
  risk: >-
    Needs `google-adk[a2a]`; every call is a network hop with its own latency
    and failure modes.
  when_not: >-
    When you own both agents and they can run in one process.
  threshold: >-
    When the agent you need is deployed by someone else.
  sources:
    - https://adk.dev/a2a/quickstart-consuming/

# --------------------------------------------------------------------------- tools and MCP

- id: adk.ref.function-tools
  intent: reference
  topic: Tools and MCP
  title: Write tools as plain functions with type hints and a docstring
  symbol: google.adk.tools.FunctionTool
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Pass plain functions in `tools=[...]`; ADK wraps each in a FunctionTool.
    The name, docstring and type-hinted parameters become the declaration the
    model sees; return a dict, and add a `tool_context: ToolContext`
    parameter to read state or save artifacts.
  gain: >-
    No schema to write by hand: the declaration follows the code, and
    tool_context gives tools state, artifacts and memory search.
  effort: 1
  impact: 3
  risk: >-
    A vague docstring makes the model call the tool wrongly; tool_context is
    hidden from the model, other parameters are not.
  when_not: >-
    When the tool is an existing API with an OpenAPI spec or an MCP server:
    use OpenAPIToolset or McpToolset.
  threshold: >-
    Every custom tool.
  sources:
    - https://adk.dev/tools-custom/function-tools/
  snippet: |
    from google.adk.tools import ToolContext

    def get_order(order_id: str, tool_context: ToolContext) -> dict:
        """Look up an order by id. Returns its status and items."""
        return {"status": "shipped", "items": 2}

- id: adk.ref.tool-confirmation
  intent: reference
  topic: Tools and MCP
  title: Ask the user to confirm a risky tool call with require_confirmation
  symbol: google.adk.tools.tool_confirmation.ToolConfirmation
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Wrap the tool as `FunctionTool(func, require_confirmation=True)` (or a
    function deciding per call). ADK pauses the call and asks the client to
    confirm before running it.
  gain: >-
    Human sign-off on payments, emails or deletions without a home-made
    "pending action" state and a second endpoint.
  effort: 1
  impact: 3
  risk: >-
    Your client must show the confirmation request and send the answer back.
  when_not: >-
    For read-only tools.
  threshold: >-
    Any tool with side effects a user would want to approve.
  sources:
    - https://adk.dev/tools-custom/confirmation/
  snippet: |
    from google.adk.tools import FunctionTool

    def delete_file(path: str) -> dict:
        """Delete a file."""
        ...

    tools = [FunctionTool(delete_file, require_confirmation=True)]

- id: adk.ref.openapi-toolset
  intent: reference
  topic: Tools and MCP
  title: Turn a REST API's OpenAPI spec into tools with OpenAPIToolset
  symbol: google.adk.tools.openapi_tool.OpenAPIToolset
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    `OpenAPIToolset(spec_str=spec, spec_str_type="json")` (or `spec_dict=`)
    creates one tool per operation; add the toolset to the agent's tools.
  gain: >-
    One tool per endpoint, with parameters and descriptions from the spec,
    instead of a hand-written wrapper per call.
  effort: 1
  impact: 3
  risk: >-
    Every operation becomes a tool; large specs crowd the model's choices,
    so filter them.
  when_not: >-
    When the API has no accurate spec.
  threshold: >-
    Once an agent needs more than two or three endpoints of one API.
  sources:
    - https://adk.dev/tools-custom/openapi-tools/

- id: adk.ref.builtin-tools
  intent: reference
  topic: Tools and MCP
  title: Use Gemini's built-in Google Search and URL context tools
  symbol: google.adk.tools.google_search
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Add `google_search` (or `url_context`) to an agent's tools for
    grounded answers with citations. These built-in tools must be the only
    tool on their agent: wrap that agent in AgentTool to combine it with
    others.
  gain: >-
    Grounded, cited web answers without a search API key or scraping code.
  effort: 1
  impact: 3
  risk: >-
    Mixing a built-in tool with other tools on one agent isn't supported.
  when_not: >-
    When answers must come only from your own data: use a retrieval tool.
  threshold: >-
    Any question about current events or public facts.
  sources:
    - https://adk.dev/grounding/google_search_grounding/
    - https://adk.dev/tools/limitations/

- id: adk.ref.code-execution
  intent: reference
  topic: Tools and MCP
  title: Let the agent run code with a code executor
  symbol: google.adk.code_executors.BuiltInCodeExecutor
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Set `code_executor=BuiltInCodeExecutor()` to use Gemini's sandboxed code
    execution, or AgentEngineSandboxCodeExecutor for a managed
    sandbox. Never use UnsafeLocalCodeExecutor outside local experiments.
  gain: >-
    Exact arithmetic and data analysis instead of the model guessing, with no
    code running on your servers.
  effort: 1
  impact: 3
  risk: >-
    BuiltInCodeExecutor can't be combined with other tools on the same agent;
    put it on its own agent behind AgentTool.
  when_not: >-
    When a deterministic function tool does the calculation.
  threshold: >-
    When users ask for calculations, charts or data transforms.
  sources:
    - https://adk.dev/integrations/code-execution/
    - https://adk.dev/tools/limitations/

- id: adk.ref.skills
  intent: reference
  topic: Tools and MCP
  title: Package reusable instructions and resources as Skills
  symbol: google.adk.tools.skill_toolset.SkillToolset
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Load skills from folders (`load_skill_from_dir`) or define them in code,
    and give the agent a `SkillToolset(skills=[...])`; the model loads a
    skill's full instructions only when it needs them.
  gain: >-
    Long, specialised instructions stay out of every prompt until used, and
    one skill folder is shared by several agents.
  effort: 2
  impact: 2
  risk: >-
    Skills are newer than most of ADK; pin the version and re-check after
    upgrades.
  when_not: >-
    For a short instruction every request needs.
  threshold: >-
    When the system instruction grows past a few pages of situational
    guidance.
  sources:
    - https://adk.dev/skills/

- id: adk.ref.toolbox
  intent: reference
  topic: Tools and MCP
  title: Give agents database tools through MCP Toolbox for Databases
  symbol: google.adk.tools.toolbox_toolset.ToolboxToolset
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Run the MCP Toolbox server with your SQL tools defined in tools.yaml and
    add `ToolboxToolset(server_url=...)` to the agent.
  gain: >-
    Parameterised, reviewed SQL queries as tools, with connection pooling and
    auth in the Toolbox server, instead of letting the model write SQL.
  effort: 2
  impact: 3
  risk: >-
    Needs the toolbox extra and a running Toolbox server.
  when_not: >-
    When the data is reached through your own API.
  threshold: >-
    As soon as an agent reads from a production database.
  sources:
    - https://adk.dev/integrations/mcp-toolbox-for-databases/

# --------------------------------------------------------------------------- sessions, state and memory

- id: adk.ref.state-templating
  intent: reference
  topic: Sessions, state and memory
  title: Insert session state into instructions with {key} placeholders
  symbol: google.adk.agents.LlmAgent
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Write `{key}` in a string instruction to insert `state["key"]`,
    `{artifact.name}` for an artifact's text, and `{key?}` to skip a key that
    may be missing. Pair it with `output_key` on the agent that produces the
    value.
  gain: >-
    Agents pass results to each other through state without glue code, and
    the instruction always shows the current value.
  effort: 1
  impact: 3
  risk: >-
    A missing key raises unless marked with `?`; an instruction function
    (InstructionProvider) bypasses the placeholders.
  when_not: >-
    When the value needs formatting or logic: use an instruction function.
  threshold: >-
    Any agent whose instruction depends on earlier steps.
  sources:
    - https://adk.dev/agents/llm-agents/
    - https://adk.dev/sessions/state/

- id: adk.ref.memory-tools
  intent: reference
  topic: Sessions, state and memory
  title: Recall past conversations with preload_memory and load_memory
  symbol: google.adk.tools.preload_memory
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Call `memory_service.add_session_to_memory(session)` when a conversation
    ends. Give the agent `preload_memory` (searched before every turn) or
    `load_memory` (the model searches when it decides to).
  gain: >-
    Long-term memory across sessions without your own vector store and
    retrieval prompt.
  effort: 2
  impact: 3
  risk: >-
    Memory is per user; decide what may be stored, and use
    VertexAiMemoryBankService in production, not the in-memory one.
  when_not: >-
    When everything needed is in the current session's state.
  threshold: >-
    When users come back and expect continuity.
  sources:
    - https://adk.dev/sessions/memory/

- id: adk.ref.sqlite-sessions
  intent: reference
  topic: Sessions, state and memory
  title: Persist sessions to a local file with SqliteSessionService
  symbol: google.adk.sessions.sqlite_session_service.SqliteSessionService
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Use `SqliteSessionService(db_path="sessions.db")` for single-machine
    deployments and local development.
  gain: >-
    Sessions survive restarts with no database server and no SQLAlchemy;
    events are stored as JSON, so the schema doesn't need migrations.
  effort: 1
  impact: 2
  risk: >-
    One file on one machine: not shared between replicas.
  when_not: >-
    With several instances: use DatabaseSessionService on PostgreSQL or
    VertexAiSessionService.
  threshold: >-
    Fine for one instance; switch when you scale out.
  sources:
    - https://github.com/google/adk-python/blob/main/src/google/adk/sessions/sqlite_session_service.py

- id: adk.ref.rewind
  intent: reference
  topic: Sessions, state and memory
  title: Undo turns with Runner.rewind_async
  symbol: google.adk.runners.Runner.rewind_async
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    `await runner.rewind_async(user_id=..., session_id=...,
    rewind_before_invocation_id=...)` rolls the session's events and state
    back to before that invocation.
  gain: >-
    "Edit and resend" or "undo" in a chat UI without copying sessions or
    rebuilding state by hand.
  effort: 1
  impact: 2
  risk: >-
    Side effects of the rewound turns (emails sent, rows written) are not
    undone.
  when_not: >-
    When tools had external side effects that must be reversed too.
  threshold: >-
    Any chat UI with edit or regenerate.
  sources:
    - https://adk.dev/sessions/session/rewind/

- id: adk.ref.artifacts
  intent: reference
  topic: Sessions, state and memory
  title: Save and load files from tools as artifacts
  symbol: google.adk.agents.callback_context.CallbackContext.save_artifact
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    In tools and callbacks, `await tool_context.save_artifact(filename,
    types.Part(...))` stores a versioned file for the session (prefix the
    name with `user:` to share it across the user's sessions) and
    `load_artifact` reads it back.
  gain: >-
    Files the agent creates or receives stay attached to the session and
    versioned, instead of being passed through state or written to local
    disk.
  effort: 1
  impact: 2
  risk: >-
    Use GcsArtifactService in production; the in-memory default loses files.
  when_not: >-
    For small values: put them in state.
  threshold: >-
    Any agent that handles uploads or produces documents or images.
  sources:
    - https://adk.dev/artifacts/

# --------------------------------------------------------------------------- callbacks and plugins

- id: adk.ref.callbacks
  intent: reference
  topic: Callbacks and plugins
  title: Guard and adapt model and tool calls with callbacks
  symbol: google.adk.agents.callback_context.CallbackContext
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Set `before_model_callback`, `before_tool_callback` and their `after_`
    pairs on an agent. A before-callback that returns an LlmResponse (or a
    dict for tools) skips the call and uses that result; returning None lets
    it run.
  gain: >-
    Guardrails, PII redaction, caching and argument checks in one place, next
    to the agent, instead of scattered around every runner call.
  effort: 2
  impact: 3
  risk: >-
    Callbacks run on every call; keep them fast and side-effect free.
  when_not: >-
    When the same rule applies to every agent: use a plugin.
  threshold: >-
    As soon as there is a rule the model must not be trusted to follow.
  sources:
    - https://adk.dev/callbacks/
    - https://adk.dev/callbacks/types-of-callbacks/
    - https://adk.dev/callbacks/design-patterns-and-best-practices/

- id: adk.ref.error-callbacks
  intent: reference
  topic: Callbacks and plugins
  title: Recover from tool and model errors with on_*_error_callback
  symbol: google.adk.agents.LlmAgent
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Set `on_tool_error_callback` or `on_model_error_callback`; return a result to replace the failed call, or None to let the
    error propagate.
  gain: >-
    One handler turns a failing tool into an answer the model can work with,
    instead of try/except in every tool.
  effort: 1
  impact: 2
  risk: >-
    Swallowing errors can hide outages; log what you replace.
  when_not: >-
    When the error should stop the run.
  threshold: >-
    Once tools call services that fail occasionally.
  sources:
    - https://adk.dev/callbacks/types-of-callbacks/
    - https://github.com/google/adk-python/blob/main/src/google/adk/agents/llm_agent.py

- id: adk.ref.plugins
  intent: reference
  topic: Callbacks and plugins
  title: Apply cross-cutting rules to every agent with plugins
  symbol: google.adk.plugins.BasePlugin
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Subclass BasePlugin and override the hooks you need (before_model,
    before_tool, on_event, on_user_message and more), then register it with
    `App(plugins=[...])`.
  gain: >-
    Logging, policy and metrics for every agent, model and tool call in the
    app from one class. Plugin callbacks run before agent-level ones, and one
    that returns a value skips them.
  effort: 2
  impact: 3
  risk: >-
    A plugin applies everywhere; a bug in it affects every agent.
  when_not: >-
    For behaviour specific to one agent: use that agent's callbacks.
  threshold: >-
    From the second agent that needs the same rule.
  sources:
    - https://adk.dev/plugins/

- id: adk.ref.reflect-retry
  intent: reference
  topic: Callbacks and plugins
  title: Let the model fix failed tool calls with ReflectAndRetryToolPlugin
  symbol: google.adk.plugins.ReflectAndRetryToolPlugin
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Register `ReflectAndRetryToolPlugin(max_retries=3)`. When a tool raises,
    the model sees the error with guidance to correct its arguments and tries
    again.
  gain: >-
    Recovers from bad arguments (wrong formats, missing fields) without
    custom retry code in each tool.
  effort: 1
  impact: 2
  risk: >-
    Retries cost model calls; tools with side effects must be safe to call
    again.
  when_not: >-
    For transient service errors: retry the request, not the model.
  threshold: >-
    When tool calls fail on malformed arguments.
  sources:
    - https://adk.dev/integrations/reflect-and-retry/

