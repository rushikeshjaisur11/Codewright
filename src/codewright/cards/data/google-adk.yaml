# Capability cards: Google Agent Development Kit (google-adk).
# Cards here are produced by the detectors in intents/adk.py and intents/adk_more.py.
# Knowledge-only entries (intent: reference) are in google-adk-reference.yaml.
# Every `versions` lower bound is the first release with the API, found by checking the
# source of one wheel per minor release on PyPI, 1.0.0 to 2.14.1.

- id: adk.workflow
  intent: agent-orchestrator
  topic: Agents and orchestration
  title: Move fixed agent orchestration to an ADK 2.0 graph workflow
  symbol: google.adk.Workflow
  kind: library
  library: google-adk
  versions: ">=2.0"
  suggestion: >-
    Express the agent sequence, parallel branches or loop as a Workflow whose
    edges connect the agents and plain functions, instead of
    SequentialAgent/ParallelAgent/LoopAgent or a hand-written driver loop.
  gain: >-
    SequentialAgent, ParallelAgent and LoopAgent are deprecated from ADK 2.0 in
    favour of Workflow and will be removed. A Workflow adds routing between
    nodes, human input, per-node retries and resumable runs, and the steps
    show up in the dev UI and traces.
  effort: 3
  impact: 4
  risk: >-
    Migration changes how state and events flow between steps; re-run your agent
    evals and compare traces before switching.
  when_not: >-
    When the order of steps is decided by the model at run time (keep an LLM
    agent with sub-agents or tools), or when this pipeline is itself a
    sub-agent of an LlmAgent: a Workflow cannot be an LlmAgent sub-agent yet.
  threshold: >-
    Worth it as soon as there are two or more fixed steps or any branch, retry or
    human approval step.
  sources:
    - https://adk.dev/graphs/
    - https://github.com/google/adk-python/blob/main/src/google/adk/agents/sequential_agent.py
    - https://developers.googleblog.com/en/why-we-built-adk-20/
  snippet: |
    from google.adk import Agent, Workflow

    planner = Agent(name="planner", model="gemini-flash-latest", instruction="...")
    writer = Agent(name="writer", model="gemini-flash-latest", instruction="...")

    root_agent = Workflow(name="pipeline", edges=[("START", planner, writer)])

- id: adk.sequential-agent
  intent: agent-orchestrator
  topic: Agents and orchestration
  title: Replace the hand-written agent loop with SequentialAgent
  symbol: google.adk.agents.SequentialAgent
  kind: library
  library: google-adk
  versions: ">=1.0,<2.0"
  match:
    deprecated_class: null
  suggestion: >-
    On ADK 1.x, wrap the agents in a SequentialAgent (or LoopAgent for repeats)
    and pass data between them through session state with output_key.
  gain: >-
    One runner call instead of a driver loop; events, state and tracing flow
    through ADK so the steps show up in the dev UI and evals.
  effort: 2
  impact: 3
  risk: >-
    These classes are deprecated in ADK 2.0; plan the move to graph workflows
    when you upgrade.
  when_not: >-
    When the next step depends on the model's decision; use an LLM agent with
    sub-agents instead.
  threshold: >-
    Once there are branches or human approval steps, upgrade to ADK 2.0 workflows.
  sources:
    - https://adk.dev/agents/workflow-agents/sequential-agents/

- id: adk.run-async
  intent: adk-sync-run
  topic: Runtime, context and apps
  title: Use Runner.run_async instead of the sync Runner.run in async code
  symbol: google.adk.runners.Runner.run_async
  kind: library
  library: google-adk
  versions: ">=1.0"
  autofix: true
  suggestion: >-
    Iterate the agent's events with `async for event in runner.run_async(...)`.
    It takes the same user_id, session_id and new_message arguments.
  gain: >-
    Runner.run starts the agent on a background thread and hands events back
    through a blocking queue, so inside async def it stalls the event loop for
    the whole turn, model calls and tools included: no other request on that
    worker moves until the agent is done. ADK documents run() as being only
    for local testing.
  effort: 1
  impact: 4
  risk: >-
    Code inside the loop now runs on the event loop between events; a slow
    synchronous step there blocks it just as before.
  when_not: >-
    In synchronous scripts and notebooks with no event loop of their own,
    where run() is the convenient choice.
  threshold: >-
    Matters from the second concurrent user: each blocked turn delays every
    other request handled by that worker.
  sources:
    - https://github.com/google/adk-python/blob/main/src/google/adk/runners.py
    - https://adk.dev/agents/llm-agents/
  snippet: |
    async for event in runner.run_async(user_id=user_id, session_id=session_id, new_message=message):
        if event.is_final_response():
            reply = event.content.parts[0].text

- id: adk.persistent-sessions
  intent: adk-in-memory-services
  topic: Sessions, state and memory
  match:
    kind: sessions
  title: Store ADK sessions in a database instead of process memory
  symbol: google.adk.sessions.DatabaseSessionService
  kind: library
  library: google-adk
  versions: ">=1.0"
  suggestion: >-
    Give the Runner a DatabaseSessionService with an async database URL
    (postgresql+asyncpg://..., or sqlite+aiosqlite:///sessions.db on one
    machine). On Vertex AI Agent Engine, use VertexAiSessionService instead.
  gain: >-
    InMemorySessionService and InMemoryRunner lose every conversation when the
    process restarts or a container is recycled, and each worker process or
    replica sees only its own sessions, so a user whose next request lands
    elsewhere starts from scratch. A database keeps sessions, events and state
    across restarts and shares them between workers.
  effort: 2
  impact: 4
  risk: >-
    Needs SQLAlchemy and an async driver (asyncpg, aiosqlite); a plain
    sqlite:// or postgresql:// URL fails. Session history now grows in the
    database, so plan retention.
  when_not: >-
    In tests, local development and single-process demos where losing sessions
    on restart is fine.
  threshold: >-
    As soon as the app runs more than one worker or replica, or is redeployed
    while users are mid-conversation.
  sources:
    - https://adk.dev/sessions/session/
    - https://adk.dev/deploy/cloud-run/
  snippet: |
    from google.adk.runners import Runner
    from google.adk.sessions import DatabaseSessionService

    session_service = DatabaseSessionService(db_url="postgresql+asyncpg://user:pass@host/agents")
    runner = Runner(agent=root_agent, app_name="my_app", session_service=session_service)

- id: adk.instruction-provider
  intent: adk-frozen-instruction
  topic: Agents and orchestration
  title: Build the instruction per request instead of once at import
  symbol: google.adk.agents.llm_agent.InstructionProvider
  kind: library
  library: google-adk
  versions: ">=1.0"
  autofix: true
  suggestion: >-
    Pass a function as `instruction` (it receives a ReadonlyContext and returns
    the text), or move the value into session state and reference it as
    `{key}` in a plain string.
  gain: >-
    An f-string is evaluated once, when the module defining the agent is
    imported, so a date, a clock reading or a config lookup inside it stays
    frozen for the life of the process. A provider runs on every model call,
    and can read session state from the context.
  effort: 1
  impact: 3
  risk: >-
    A provider's text is not scanned for `{key}` state placeholders; build any
    such values yourself from ctx.state. The function now runs on every turn,
    so keep it cheap.
  when_not: >-
    When the interpolated value really is fixed for the life of the process,
    such as a product name read from settings at startup.
  threshold: >-
    Any long-running server: a date in the instruction goes stale after
    midnight on the first day.
  sources:
    - https://adk.dev/agents/llm-agents/
    - https://github.com/google/adk-python/blob/main/src/google/adk/agents/llm_agent.py
  snippet: |
    from datetime import date

    from google.adk.agents import LlmAgent

    root_agent = LlmAgent(
        name="assistant",
        model="gemini-flash-latest",
        instruction=lambda ctx: f"Today is {date.today():%A %d %B}. Help {ctx.state.get('user_name', 'the user')}.",
    )

- id: adk.fast-api-app
  intent: adk-hand-server
  topic: Serving and deployment
  title: Serve the agent with ADK's get_fast_api_app instead of hand-written routes
  symbol: google.adk.cli.fast_api.get_fast_api_app
  kind: library
  library: google-adk
  versions: ">=1.5"
  suggestion: >-
    Build the app with get_fast_api_app(agents_dir=..., session_service_uri=...,
    web=False) and add your own routes to the FastAPI app it returns.
  gain: >-
    One call gives the run and streaming (/run, /run_sse) endpoints, session
    and artifact APIs and, with web=True, the dev UI, wired to the session,
    artifact and memory services named by URI. The endpoint code, session
    lookup and event streaming you maintain by hand go away.
  effort: 3
  impact: 3
  risk: >-
    The request and response shapes become ADK's, so existing clients need
    updating; check CORS (allow_origins) and add authentication in front of
    it yourself.
  when_not: >-
    When the endpoint is a small part of a larger product API with its own
    request shape, auth and error handling, or the agent runs inside another
    framework's request lifecycle.
  threshold: >-
    Worth it once you maintain more than a single run endpoint: streaming,
    session listing or resuming, artifacts, or the dev UI.
  sources:
    - https://adk.dev/deploy/cloud-run/
    - https://adk.dev/runtime/api-server/
  snippet: |
    import os

    from google.adk.cli.fast_api import get_fast_api_app

    app = get_fast_api_app(
        agents_dir=os.path.dirname(os.path.abspath(__file__)),
        session_service_uri="sqlite+aiosqlite:///./sessions.db",
        allow_origins=["https://app.example.com"],
        web=False,
    )

- id: adk.gemini-retry-options
  intent: retry
  topic: Models
  title: Let the Gemini client retry instead of a hand-written loop around the agent
  symbol: google.genai.types.HttpRetryOptions
  kind: library
  library: google-adk
  versions: ">=1.9.0"
  match:
    adk: true
  suggestion: >-
    Configure retries on the model, `Gemini(model=..., retry_options=types.HttpRetryOptions(attempts=5))`,
    and drop the loop, sleep and counter around the run.
  gain: >-
    The client retries only the failed model request, with exponential
    backoff and jitter, on 408, 429 and 5xx responses and transient
    connection errors. A loop around the whole run repeats every step of the
    turn, tool calls included, and appends a duplicate user message to the
    session on each try.
  effort: 1
  impact: 3
  risk: >-
    Retries add latency to a turn that is already slow; cap attempts and
    max_delay so a user isn't left waiting on a struggling model.
  when_not: >-
    When the loop retries on your own tool or application errors rather than
    model API errors; handle those in the tool or with a Workflow node's retry.
  threshold: >-
    As soon as you see 429 (quota) or 503 responses from the model in
    production.
  sources:
    - https://adk.dev/agents/models/google-gemini/
    - https://github.com/google/adk-python/blob/main/src/google/adk/models/google_llm.py
  snippet: |
    from google.adk.agents import LlmAgent
    from google.adk.models import Gemini
    from google.genai import types

    root_agent = LlmAgent(
        name="assistant",
        model=Gemini(model="gemini-flash-latest", retry_options=types.HttpRetryOptions(attempts=5, max_delay=30)),
        instruction="...",
    )

# --------------------------------------------------------------------------- agents and structured output

- id: adk.output-schema
  intent: adk-parse-model-json
  topic: Agents and orchestration
  title: Let the agent return structured output with output_schema
  symbol: google.adk.agents.LlmAgent
  kind: library
  library: google-adk
  versions: ">=1.0"
  suggestion: >-
    Give the agent `output_schema=` a Pydantic model and `output_key=` a state
    key. ADK asks the model for that schema, validates the reply and stores
    it in session state, where the next step reads it.
  gain: >-
    The model is constrained to the schema instead of being asked nicely for
    JSON, so the fenced, truncated or chatty replies that make json.loads fail
    in production go away, and the parsed value lands in state for the next
    agent or tool.
  effort: 2
  impact: 3
  risk: >-
    Before 1.11.0 an agent with output_schema can't use tools, and before
    1.20.0 it can't have sub-agents or transfer control; on those versions
    split the work into a tool-using agent and a formatting agent.
  when_not: >-
    When the reply is free text for a person, or the JSON is something the
    model is quoting rather than producing.
  threshold: >-
    As soon as the parsed result feeds code: one malformed reply in a few
    hundred is enough to page someone.
  sources:
    - https://adk.dev/agents/llm-agents/
    - https://github.com/google/adk-python/blob/main/src/google/adk/agents/llm_agent.py
  snippet: |
    from pydantic import BaseModel

    from google.adk.agents import LlmAgent

    class Ticket(BaseModel):
        title: str
        priority: int

    triage = LlmAgent(
        name="triage",
        model="gemini-flash-latest",
        instruction="Turn the user's report into a ticket.",
        output_schema=Ticket,
        output_key="ticket",  # session.state["ticket"] holds the validated dict
    )

- id: adk.runner-once
  intent: adk-runner-per-request
  topic: Serving and deployment
  title: Build the agent and Runner once at startup, not per request
  symbol: google.adk.runners.Runner
  kind: library
  library: google-adk
  versions: ">=1.0"
  suggestion: >-
    Create the agent, the session service and the Runner once (at module level
    or in the app's lifespan) and reuse them in every request; pass the user
    and session ids to run_async.
  gain: >-
    A Runner holds the session, artifact and memory services and the plugin
    manager; building one per request repeats that setup on every call, and
    with an InMemoryRunner or InMemorySessionService each request starts with
    an empty session store, so the conversation is forgotten between turns.
  effort: 1
  impact: 4
  risk: >-
    Shared objects must not hold per-request data; keep user data in session
    state, not on the agent or Runner.
  when_not: >-
    When the agent itself is generated per tenant from configuration; then
    cache one Runner per tenant instead of one per request.
  threshold: >-
    From the second turn of any conversation, if the session service is in
    memory; otherwise once request latency matters.
  sources:
    - https://adk.dev/runtime/event-loop/
    - https://adk.dev/sessions/session/

# --------------------------------------------------------------------------- sessions and state

- id: adk.state-delta
  intent: adk-direct-state-write
  topic: Sessions, state and memory
  title: Change session state through an event, not on the session object
  symbol: google.adk.events.EventActions
  kind: library
  library: google-adk
  versions: ">=1.0"
  suggestion: >-
    Inside tools and callbacks, write to `tool_context.state` or
    `callback_context.state`. From application code, pass `state_delta=` to
    run_async (1.7.0+), or append an Event with `EventActions(state_delta=...)`
    through `session_service.append_event`.
  gain: >-
    A Session returned by the session service is a snapshot: assigning to its
    state changes only that copy. ADK records state changes as events, so the
    direct write is never saved by DatabaseSessionService or Vertex, is
    invisible to the next run, and can be overwritten by a concurrent turn.
  effort: 1
  impact: 4
  risk: >-
    Moving the write into an event changes when it becomes visible: after the
    event is appended, not immediately.
  when_not: >-
    In a unit test that builds a Session by hand and never persists it.
  threshold: >-
    Any deployment with a persistent session service, where the lost write
    shows up as state that silently resets.
  sources:
    - https://adk.dev/sessions/state/
    - https://adk.dev/events/
  snippet: |
    async for event in runner.run_async(
        user_id=user_id,
        session_id=session_id,
        new_message=message,
        state_delta={"user:plan": "pro"},  # recorded with the turn, saved by the session service
    ):
        ...

- id: adk.state-scopes
  intent: adk-module-dict-state
  topic: Sessions, state and memory
  title: Keep tool data in session state with user and app scopes, not a module dict
  symbol: google.adk.tools.ToolContext
  kind: library
  library: google-adk
  versions: ">=1.0"
  suggestion: >-
    Take a `tool_context: ToolContext` parameter and use `tool_context.state`:
    plain keys belong to the session, `user:` keys to every session of that
    user, `app:` keys to every user, and `temp:` keys last one invocation.
  gain: >-
    A module-level dict is per process: it is empty after a restart, different
    on every worker or replica, and shared between all users, so one user's
    data can leak into another's answers. Session state is stored by the
    session service and scoped by the prefix you choose.
  effort: 2
  impact: 4
  risk: >-
    Values must be serialisable (strings, numbers, lists, dicts), and state is
    only durable with DatabaseSessionService or VertexAiSessionService.
  when_not: >-
    For read-only lookup tables or caches of public data that are the same for
    every user.
  threshold: >-
    As soon as there is a second user or a second worker process.
  sources:
    - https://adk.dev/sessions/state/
  snippet: |
    from google.adk.tools import ToolContext

    def remember_language(language: str, tool_context: ToolContext) -> dict:
        """Remember the user's preferred language."""
        tool_context.state["user:language"] = language  # every session of this user sees it
        return {"status": "ok"}

- id: adk.memory-bank
  intent: adk-in-memory-services
  topic: Sessions, state and memory
  title: Keep long-term memory in Vertex AI Memory Bank, not process memory
  symbol: google.adk.memory.VertexAiMemoryBankService
  kind: library
  library: google-adk
  versions: ">=1.5.0"
  match:
    kind: memory
  suggestion: >-
    Give the Runner a VertexAiMemoryBankService for your Agent Engine, add
    finished sessions with `add_session_to_memory`, and give agents the
    `preload_memory` or `load_memory` tool to recall them.
  gain: >-
    InMemoryMemoryService forgets everything on restart and matches memories
    by keyword only; Memory Bank stores them durably, extracts and
    consolidates facts with a model, and retrieves them by meaning.
  effort: 3
  impact: 3
  risk: >-
    Needs a Vertex AI Agent Engine and adds a paid service; memories are
    shared per user, so decide what may be remembered.
  when_not: >-
    In local development and tests, or when the app has no notion of a
    returning user.
  threshold: >-
    Once users return across sessions and expect the agent to remember them.
  sources:
    - https://adk.dev/sessions/memory/

- id: adk.gcs-artifacts
  intent: adk-in-memory-services
  topic: Sessions, state and memory
  title: Store artifacts in Cloud Storage, not process memory
  symbol: google.adk.artifacts.GcsArtifactService
  kind: library
  library: google-adk
  versions: ">=1.0"
  match:
    kind: artifacts
  suggestion: >-
    Give the Runner a `GcsArtifactService(bucket_name=...)`. Tools keep using
    `tool_context.save_artifact` and `load_artifact` unchanged.
  gain: >-
    InMemoryArtifactService holds every saved file (uploads, generated images,
    reports) in the server's RAM: they are gone on restart, invisible to other
    replicas, and memory grows with every upload. GCS keeps them durably and
    versioned per session or user.
  effort: 2
  impact: 3
  risk: >-
    On google-adk 2.x it needs `google-adk[gcp]` for google-cloud-storage, and
    the service account needs access to the bucket.
  when_not: >-
    For local development, where `FileArtifactService` (1.19.0+) writes to
    disk without a bucket.
  threshold: >-
    As soon as the app runs on more than one instance or users upload files.
  sources:
    - https://adk.dev/artifacts/
  snippet: |
    from google.adk.artifacts import GcsArtifactService

    runner = Runner(
        agent=root_agent,
        app_name="my_app",
        session_service=session_service,
        artifact_service=GcsArtifactService(bucket_name="my-agent-artifacts"),
    )

- id: adk.events-compaction
  intent: adk-history-slice
  topic: Runtime, context and apps
  title: Compact long conversations with EventsCompactionConfig instead of slicing events
  symbol: google.adk.apps.app.EventsCompactionConfig
  kind: library
  library: google-adk
  versions: ">=1.16.0"
  suggestion: >-
    Wrap the agent in an App with `events_compaction_config=EventsCompactionConfig(compaction_interval=..., overlap_size=...)`.
    ADK summarises older invocations into one event and keeps sending that summary.
  gain: >-
    Slicing `session.events` drops whatever falls outside the window, often
    the user's original goal or a tool result, and has to be repeated wherever
    history is read. Compaction keeps a model-written summary of what was cut,
    so context stays small without forgetting it.
  effort: 2
  impact: 3
  risk: >-
    Summaries cost a model call and can lose detail; tune compaction_interval
    and overlap_size against your evals.
  when_not: >-
    When each turn is independent and history isn't needed at all: set
    `include_contents="none"` on the agent instead.
  threshold: >-
    Once conversations run long enough to approach the model's context window
    or noticeably raise latency and cost.
  sources:
    - https://adk.dev/context/compaction/
  snippet: |
    from google.adk.apps import App
    from google.adk.apps.app import EventsCompactionConfig

    app = App(
        name="my_app",
        root_agent=root_agent,
        events_compaction_config=EventsCompactionConfig(compaction_interval=10, overlap_size=2),
    )

- id: adk.context-filter
  intent: adk-history-slice
  topic: Runtime, context and apps
  title: Keep only recent turns with ContextFilterPlugin instead of slicing events
  symbol: google.adk.plugins.context_filter_plugin.ContextFilterPlugin
  kind: library
  library: google-adk
  versions: ">=1.15.1,<1.16.0"
  suggestion: >-
    Register `ContextFilterPlugin(num_invocations_to_keep=...)` so every model
    call sees only the most recent invocations.
  gain: >-
    One plugin trims the context for every agent and model call, instead of
    slicing `session.events` wherever history is read. Upgrade to 1.16.0+ for
    compaction, which summarises what it cuts.
  effort: 1
  impact: 2
  risk: >-
    Older turns are dropped, not summarised; the model forgets them.
  when_not: >-
    When the earliest turns carry the user's goal or constraints.
  threshold: >-
    Once long conversations raise latency or cost noticeably.
  sources:
    - https://github.com/google/adk-python/blob/main/src/google/adk/plugins/context_filter_plugin.py

# --------------------------------------------------------------------------- tools and MCP

- id: adk.agent-tool
  intent: adk-tool-runs-agent
  topic: Tools and MCP
  title: Wrap the agent in AgentTool instead of running it inside a tool
  symbol: google.adk.tools.agent_tool.AgentTool
  kind: library
  library: google-adk
  versions: ">=1.0"
  suggestion: >-
    Pass `AgentTool(agent=specialist)` in the calling agent's tools. ADK runs
    the specialist in the same invocation and returns its final answer as the
    tool result.
  gain: >-
    A Runner started inside a tool is a second, separate invocation: it has
    its own session, so it can't see the user's state, its events and token
    use don't appear in the parent's trace, and plugins and callbacks don't
    run for it. AgentTool keeps it inside the parent run.
  effort: 1
  impact: 3
  risk: >-
    The wrapped agent's reply becomes a tool result the parent model reads,
    so the parent stays in control; use sub_agents if control should move to
    the specialist instead.
  when_not: >-
    When the inner agent must run in another service or process; connect it
    with A2A (RemoteA2aAgent) instead.
  threshold: >-
    As soon as the inner agent needs the user's state or must show up in
    traces and evals.
  sources:
    - https://adk.dev/tools-custom/function-tools/
    - https://github.com/google/adk-python/blob/main/src/google/adk/tools/agent_tool.py
  snippet: |
    from google.adk.agents import LlmAgent
    from google.adk.tools.agent_tool import AgentTool

    summarizer = LlmAgent(name="summarizer", model="gemini-flash-latest", instruction="Summarise the text.")
    root_agent = LlmAgent(
        name="assistant",
        model="gemini-flash-latest",
        tools=[AgentTool(agent=summarizer)],
    )

- id: adk.mcp-toolset
  intent: adk-hand-mcp-client
  topic: Tools and MCP
  title: Connect MCP servers with McpToolset instead of a hand-written client
  symbol: google.adk.tools.mcp_tool.McpToolset
  kind: library
  library: google-adk
  versions: ">=1.13.0"
  suggestion: >-
    Put `McpToolset(connection_params=StdioConnectionParams(...))` (or
    `StreamableHTTPConnectionParams(url=...)`) in the agent's tools, with
    `tool_filter=[...]` to expose only the tools you want.
  gain: >-
    McpToolset lists the server's tools, turns their schemas into function
    declarations, calls them and manages the session's lifetime and
    reconnects. The hand-written client, the wrapper per tool and the session
    cleanup go away.
  effort: 2
  impact: 3
  risk: >-
    Every tool the server offers is exposed to the model unless you filter;
    on google-adk 2.x install `google-adk[mcp]`, or the import fails.
  when_not: >-
    When you need one fixed call to an MCP server from application code, not
    tools the model chooses.
  threshold: >-
    As soon as the agent uses more than one or two of the server's tools.
  sources:
    - https://adk.dev/tools-custom/mcp-tools/
  snippet: |
    from google.adk.tools.mcp_tool import McpToolset, StdioConnectionParams
    from mcp import StdioServerParameters

    files = McpToolset(
        connection_params=StdioConnectionParams(
            server_params=StdioServerParameters(command="npx", args=["-y", "@modelcontextprotocol/server-filesystem", "/data"]),
        ),
        tool_filter=["read_file", "list_directory"],
    )

- id: adk.mcp-toolset-1x
  intent: adk-hand-mcp-client
  topic: Tools and MCP
  title: Connect MCP servers with MCPToolset instead of a hand-written client
  symbol: google.adk.tools.mcp_tool.MCPToolset
  kind: library
  library: google-adk
  versions: ">=1.0,<1.13.0"
  suggestion: >-
    Put `MCPToolset(connection_params=...)` in the agent's tools, with
    `tool_filter=[...]` to expose only the tools you want. From 1.13.0 the
    class is also named McpToolset.
  gain: >-
    MCPToolset lists the server's tools, turns their schemas into function
    declarations, calls them and manages the session. The hand-written client
    and per-tool wrappers go away.
  effort: 2
  impact: 3
  risk: >-
    Every tool the server offers is exposed unless you filter.
  when_not: >-
    When you need one fixed call to an MCP server from application code.
  threshold: >-
    As soon as the agent uses more than one or two of the server's tools.
  sources:
    - https://adk.dev/tools-custom/mcp-tools/

- id: adk.long-running-tool
  intent: adk-polling-tool
  topic: Tools and MCP
  title: Return from long jobs with LongRunningFunctionTool instead of polling in the tool
  symbol: google.adk.tools.LongRunningFunctionTool
  kind: library
  library: google-adk
  versions: ">=1.0"
  suggestion: >-
    Start the job and return its id at once from a `LongRunningFunctionTool`;
    when the job finishes, send its result back as a function response in a
    new message. With `ResumabilityConfig(is_resumable=True)` on the App
    (1.16.0+), the paused invocation resumes from there.
  gain: >-
    A sleep loop inside a tool holds the whole turn, the model call and the
    request open until the job is done, which times out behind load balancers
    and ties up a worker. A long-running tool lets the agent tell the user
    it's working and pick up when the result arrives.
  effort: 3
  impact: 3
  risk: >-
    Your app has to deliver the job's result back to the session; resumed
    tool calls must be idempotent because ADK only guarantees at-least-once.
  when_not: >-
    When the job reliably finishes in a few seconds.
  threshold: >-
    Once a job can outlast your HTTP timeout (often 30 to 60 seconds).
  sources:
    - https://adk.dev/tools-custom/function-tools/
    - https://adk.dev/runtime/resume/

