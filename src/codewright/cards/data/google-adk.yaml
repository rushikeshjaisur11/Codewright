# --------------------------------------------------------------------------- google-adk extras

- id: adk.extra-mcp
  intent: adk-missing-extra
  topic: Upgrading
  title: Install google-adk[mcp]; McpToolset is silently missing without it
  symbol: "google-adk[mcp]"
  kind: library
  library: google-adk
  versions: ">=2.0"
  match:
    package: mcp
  unless_installed: [mcp]
  extra: mcp
  suggestion: >-
    Depend on `google-adk[mcp]` (or add `mcp`) and re-lock.
  gain: >-
    google-adk 2.0 moved the mcp package out of the base install. Without it,
    `google.adk.tools.mcp_tool` swallows the import error and exports
    nothing, so `from google.adk.tools.mcp_tool import McpToolset` fails with
    a bare "cannot import name" and no hint about the extra.
  effort: 1
  impact: 5
  risk: >-
    None; this restores what 1.x installed by default.
  when_not: >-
    Never: the import fails at startup.
  threshold: >-
    Immediately: this is an import error, not a slowdown.
  sources:
    - https://pypi.org/project/google-adk/
    - https://github.com/google/adk-python/blob/main/src/google/adk/tools/mcp_tool/__init__.py

