[project]
name = "codewright"
version = "0.4.0"
description = "Version-aware code and architecture advisor for Python: proven 'instead of X, use Y' fixes, live architecture maps and design-to-code drift checks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "code-review", "static-analysis", "refactoring", "architecture", "tree-sitter",
    "developer-tools", "mcp", "fastapi", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.15"]

[project.urls]
Homepage = "https://github.com/rushikeshjaisur11/codewright"
Repository = "https://github.com/rushikeshjaisur11/codewright"
Issues = "https://github.com/rushikeshjaisur11/codewright/issues"

[project.scripts]
codewright = "codewright.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codewright"]
artifacts = ["src/codewright/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",    # typer.Option(...) / fastapi.Body(...) defaults are those frameworks' intended style
    "RUF001",  # − and × in user-facing text are deliberate
    "UP042",   # keep (str, Enum): StrEnum changes str() output
]

[tool.ruff.lint.isort]
known-first-party = ["codewright"]
