[project]
name = "codewright"
version = "0.2.0"
description = "A code and architecture advisor that suggests version-aware, proven 'instead of X, use Y' changes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
codewright = "codewright.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codewright"]
artifacts = ["src/codewright/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
